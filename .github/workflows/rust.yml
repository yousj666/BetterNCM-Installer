name: Rust

on:
  release:
    types:
    - created
    - edited
  push:
    branches: [ main, yousj-plus ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Switch nightly
      run:
        rustup default nightly; rustup target add i686-pc-windows-msvc; rustup component add rust-src
    - name: Build
      run:
        cargo +nightly build --release --verbose -Z build-std=core,alloc,std,panic_abort --target i686-pc-windows-msvc
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BetterNCM-Installer-${{ github.ref_name }}
        path: ${{ github.workspace }}/target/i686-pc-windows-msvc/release/betterncm_installer.exe
    - name: Upload to Release Action
      if: ${{ github.event_name == 'release' }}
      uses: Shopify/upload-to-release@v1.0.1
      with:
        name: betterncm_installer.exe
        path: ${{ github.workspace }}/target/i686-pc-windows-msvc/release/betterncm_installer.exe
        repo-token: ${{ secrets.GITHUB_TOKEN }}
